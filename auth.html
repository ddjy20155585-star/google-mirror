<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google 镜像站 · 统一登录</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', arial, sans-serif; }
        :root { --bg: #fff; --text: #202124; --text-secondary: #5f6368; --border: #dfe1e5; --hover: rgba(60,64,67,0.08); --blue: #1a73e8; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        .top-bar {
            display: flex; align-items: center; gap: 16px;
            padding: 14px 30px; border-bottom: 1px solid var(--border);
        }
        .logo-mini { display: flex; align-items: center; height: 28px; cursor: pointer; }
        .logo-mini svg { height: 28px; width: auto; }
        .page-title { font-size: 20px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .page-title .material-icons-outlined { font-size: 24px; color: var(--blue); }
        .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .card {
            background: #fff; border-radius: 20px; padding: 40px;
            max-width: 520px; width: 100%;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            text-align: center;
        }
        .icon-big {
            width: 80px; height: 80px; margin: 0 auto 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4285F4, #34A853);
            display: flex; align-items: center; justify-content: center;
        }
        .icon-big .material-icons-outlined { font-size: 44px; color: #fff; }
        .card h1 { font-size: 24px; font-weight: 500; margin-bottom: 12px; }
        .card > p { font-size: 14px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 24px; }
        .scope-list {
            text-align: left; margin: 20px 0; padding: 16px;
            background: var(--hover); border-radius: 12px;
            font-size: 13px; color: var(--text); line-height: 1.8;
        }
        .scope-list .scope-item { display: flex; align-items: center; gap: 8px; }
        .scope-list .material-icons-outlined { font-size: 16px; color: #1e8e3e; }
        .connect-btn {
            background: var(--blue); color: #fff;
            padding: 13px 32px; border-radius: 26px;
            font-size: 15px; font-weight: 500;
            border: none; cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px;
            transition: all 0.2s;
        }
        .connect-btn:hover { background: #1b66c9; transform: translateY(-2px); box-shadow: 0 4px 12px rgba(26,115,232,0.3); }
        .status-box {
            margin-top: 24px; padding: 16px;
            background: #e6f4ea; border-radius: 12px;
            font-size: 14px; color: #1e8e3e;
        }
        .signout-btn {
            background: transparent; color: var(--text-secondary);
            border: 1px solid var(--border); padding: 10px 24px;
            border-radius: 20px; font-size: 14px; cursor: pointer;
            margin-top: 16px;
        }
        .signout-btn:hover { background: var(--hover); color: var(--text); }
        .user-info { display: flex; align-items: center; gap: 12px; justify-content: center; margin-bottom: 16px; }
        .user-info img { width: 48px; height: 48px; border-radius: 50%; }
        .user-info .name { font-size: 16px; font-weight: 500; text-align: left; }
        .user-info .email { font-size: 13px; color: var(--text-secondary); }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="logo-mini" onclick="location.href='index.html'">
            <svg viewBox="0 0 272 92" xmlns="http://www.w3.org/2000/svg">
                <path fill="#4285F4" d="M115.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18C71.25 34.32 81.24 25 93.5 25s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44S80.99 39.2 80.99 47.18c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z"/>
                <path fill="#EA4335" d="M163.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18c0-12.85 9.99-22.18 22.25-22.18s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44s-12.51 5.46-12.51 13.44c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z"/>
                <path fill="#FBBC05" d="M209.75 26.34v39.82c0 16.38-9.66 23.07-21.08 23.07-10.75 0-17.22-7.19-19.66-13.07l8.48-3.53c1.51 3.61 5.21 7.87 11.17 7.87 7.31 0 11.84-4.51 11.84-13v-3.19h-.34c-2.18 2.69-6.38 5.04-11.68 5.04-11.09 0-21.25-9.66-21.25-22.09 0-12.52 10.16-22.26 21.25-22.26 5.29 0 9.49 2.35 11.68 4.96h.34v-3.61h9.25zm-8.56 20.92c0-7.81-5.21-13.52-11.84-13.52-6.72 0-12.35 5.71-12.35 13.52 0 7.73 5.63 13.36 12.35 13.36 6.63 0 11.84-5.63 11.84-13.36z"/>
                <path fill="#34A853" d="M225 3v65h-9.5V3h9.5z"/>
                <path fill="#4285F4" d="M262.02 54.48l7.56 5.04c-2.44 3.61-8.32 9.83-18.48 9.83-12.6 0-22.01-9.74-22.01-22.18 0-13.19 9.49-22.18 20.92-22.18 11.51 0 17.14 9.16 18.98 14.11l1.01 2.52-29.65 12.28c2.27 4.45 5.8 6.72 10.75 6.72 4.96 0 8.4-2.44 10.92-6.14zm-23.27-7.98l19.82-8.23c-1.09-2.77-4.37-4.7-8.23-4.7-4.95 0-11.84 4.37-11.59 12.93z"/>
                <path fill="#EA4335" d="M35.29 41.41V32H67c.31 1.64.47 3.58.47 5.68 0 7.06-1.93 15.79-8.15 22.01-6.05 6.3-13.78 9.66-24.02 9.66C16.32 69.35.36 53.89.36 34.91.36 15.93 16.32.47 35.3.47c10.5 0 17.98 4.12 23.6 9.49l-6.64 6.64c-4.03-3.78-9.49-6.72-16.97-6.72-13.86 0-24.7 11.17-24.7 25.03 0 13.86 10.84 25.03 24.7 25.03 8.99 0 14.11-3.61 17.39-6.89 2.66-2.66 4.41-6.46 5.1-11.65l-22.49.01z"/>
            </svg>
        </div>
        <div class="page-title">
            <span class="material-icons-outlined">verified_user</span>
            统一登录
        </div>
    </div>

    <div class="main">
        <div class="card" id="card"></div>
    </div>

    <script>
    (function() {
        const CLIENT_ID = '190052147870-7nijunioqnib8n6ma9etn7pnfgvfrg0u.apps.googleusercontent.com';
        const REDIRECT_URI = window.location.origin + window.location.pathname;

// 所有范围，一次性请求
const ALL_SCOPES = [
  'openid', 'email', 'profile',
  'https://www.googleapis.com/auth/drive.file',
  'https://www.googleapis.com/auth/drive.appdata',
  'https://www.googleapis.com/auth/spreadsheets',
  'https://www.googleapis.com/auth/calendar.events',
  'https://www.googleapis.com/auth/tasks',
  'https://www.googleapis.com/auth/documents',
  'https://www.googleapis.com/auth/contacts.readonly',
  'https://www.googleapis.com/auth/presentations',
  'https://www.googleapis.com/auth/forms.body',
  'https://www.googleapis.com/auth/forms.responses.readonly'
].join(' ');
        const STORAGE_TOKEN = 'gm_token';
        const STORAGE_USER = 'gm_user';
        const STORAGE_TOKEN_TIME = 'gm_token_time';

        const card = document.getElementById('card');

        // ========== 工具 ==========
        function safeGet(key, def) {
            try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }
            catch(e) { return def; }
        }
        function safeSet(key, val) {
            try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
        }
        function safeRemove(key) {
            try { localStorage.removeItem(key); } catch(e) {}
        }

        // ========== 解析 hash ==========
        function parseHashParams() {
            const hash = window.location.hash.substring(1);
            if (!hash) return {};
            const params = {};
            hash.split('&').forEach(pair => {
                const [k, v] = pair.split('=');
                if (k && v) params[k] = decodeURIComponent(v);
            });
            return params;
        }

        // ========== 渲染 ==========
        function renderSignedOut() {
            card.innerHTML = `
                <div class="icon-big">
                    <span class="material-icons-outlined">lock</span>
                </div>
                <h1>统一登录</h1>
                <p>一次授权，即可使用镜像站的所有功能，无需重复登录。</p>
                <div class="scope-list">
                    <div class="scope-item"><span class="material-icons-outlined">check_circle</span>基础信息（姓名、邮箱、头像）</div>
                    <div class="scope-item"><span class="material-icons-outlined">check_circle</span>云端硬盘文件管理</div>
                    <div class="scope-item"><span class="material-icons-outlined">check_circle</span>电子表格读写</div>
                    <div class="scope-item"><span class="material-icons-outlined">check_circle</span>日历事件管理</div>
                    <div class="scope-item"><span class="material-icons-outlined">check_circle</span>待办清单管理</div>
                    <div class="scope-item"><span class="material-icons-outlined">check_circle</span>通讯录（只读）</div>
                </div>
                <button class="connect-btn" id="connectBtn">
                    <span class="material-icons-outlined">login</span>
                    使用 Google 账号登录
                </button>
            `;
            document.getElementById('connectBtn').addEventListener('click', startAuth);
        }

        function renderSignedIn(user, tokenAge) {
            const ageStr = tokenAge ? `${Math.round(tokenAge / 60000)} 分钟前` : '刚刚';
            card.innerHTML = `
                <div class="user-info">
                    <img src="${user.picture || ''}" alt="">
                    <div>
                        <div class="name">${user.name || user.email || '用户'}</div>
                        <div class="email">${user.email || ''}</div>
                    </div>
                </div>
                <div class="status-box">
                    <span class="material-icons-outlined" style="font-size:16px;vertical-align:middle;">check_circle</span>
                    已登录 · 授权时间：${ageStr}
                </div>
                <p style="margin-top:16px;font-size:13px;color:#5f6368;">现在可以访问任何页面，无需重新授权。</p>
                <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
                    <a class="connect-btn" href="index.html" style="text-decoration:none;">
                        <span class="material-icons-outlined">home</span>
                        返回首页
                    </a>
                    <button class="signout-btn" id="signoutBtn">退出登录</button>
                </div>
            `;
            document.getElementById('signoutBtn').addEventListener('click', signOut);
        }

        // ========== 登录 ==========
        function startAuth() {
            const authUrl = 'https://accounts.google.com/o/oauth2/v2/auth?' +
                'client_id=' + encodeURIComponent(CLIENT_ID) +
                '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) +
                '&response_type=token' +
                '&scope=' + encodeURIComponent(ALL_SCOPES) +
                '&include_granted_scopes=true' +
                '&prompt=consent select_account';
            window.location.href = authUrl;
        }

        // ========== 拉用户信息 ==========
        function fetchUserInfo(token) {
            return fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                headers: { Authorization: 'Bearer ' + token }
            }).then(r => {
                if (!r.ok) throw new Error('userinfo failed');
                return r.json();
            });
        }

        // ========== 退出 ==========
        function signOut() {
            safeRemove(STORAGE_TOKEN);
            safeRemove(STORAGE_USER);
            safeRemove(STORAGE_TOKEN_TIME);
            render();
        }

        // ========== 渲染调度 ==========
        function render() {
            const token = safeGet(STORAGE_TOKEN, null);
            const user = safeGet(STORAGE_USER, null);
            const tokenTime = safeGet(STORAGE_TOKEN_TIME, null);

            if (token && user) {
                const age = tokenTime ? Date.now() - tokenTime : 0;
                renderSignedIn(user, age);
            } else {
                renderSignedOut();
            }
        }

        // ========== 处理回调 ==========
        async function handleCallback() {
            const params = parseHashParams();
            if (params.access_token) {
                safeSet(STORAGE_TOKEN, params.access_token);
                safeSet(STORAGE_TOKEN_TIME, Date.now());
                history.replaceState(null, '', window.location.pathname + window.location.search);
                try {
                    const user = await fetchUserInfo(params.access_token);
                    safeSet(STORAGE_USER, user);
                } catch(e) {
                    console.error(e);
                }
            }
        }

        // ========== 启动 ==========
        (async function init() {
            await handleCallback();
            render();
        })();
    })();
    </script>
